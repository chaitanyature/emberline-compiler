name: Compiler checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  semantics:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run demo
      - run: node bin/ember.js build examples/tail.em -o /tmp/tail.embc && node bin/ember.js exec /tmp/tail.embc
